
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lingua Space - Study Requests</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#B9A3E8">
    <link rel="icon" type="image/png" sizes="192x192" href="/images/lingua-space-icon-192.png">
    <link rel="apple-touch-icon" href="/images/lingua-space-icon-192.png">
</head>
<body>
<script src="/js/i18n.js"></script>
<div class="ls-picker-slot"><select class="ls-lang-picker" data-lang-picker data-i18n-aria="ui.picker" aria-label="Interface language"></select></div>
<h1 data-i18n="study.h1">What do you want to learn?</h1>

<form th:action="@{/study-requests}"
      th:object="${studyRequest}"
      method="post">

    <label data-i18n="vocab.fLanguage">Language</label>
    <select th:field="*{language}" required>
        <option value="" data-i18n="study.selectLang">Select a language</option>
        <option value="English">English</option>
        <option value="Japanese">Japanese</option>
        <option value="Chinese">Chinese</option>
        <option value="Spanish">Spanish</option>
        <option value="Korean">Korean</option>
        <option value="French">French</option>
        <option value="German">German</option>
        <option value="Italian">Italian</option>
        <option value="Vietnamese">Vietnamese</option>
        <option value="Filipino">Filipino</option>
    </select>

    <p>
        <label data-i18n="study.goal">My goal</label><br>
        <input type="text" th:field="*{goal}"
               placeholder="e.g. Travel conversation" data-i18n-ph="study.phGoal"
               maxlength="100" required>
    </p>

    <p>
        <label data-i18n="study.topic">What do you want to learn?</label><br>
        <textarea th:field="*{topic}"
                  placeholder="e.g. Ordering food at a restaurant" data-i18n-ph="study.phTopic"
                  maxlength="1000" required></textarea>
    </p>

    <p>
        <label data-i18n="study.difficult">What is difficult for you?</label><br>
        <textarea th:field="*{difficultPart}"
                  placeholder="e.g. I don't know how to speak politely" data-i18n-ph="study.phDifficult"
                  maxlength="1000"></textarea>
    </p>

    <button type="submit" data-i18n="study.save">Save my study request</button>
</form>

<hr>

<h2 data-i18n="study.savedTitle">Saved study requests</h2>

<p th:if="${#lists.isEmpty(requests)}" data-i18n="study.none">
    No study requests yet.
</p>

<article th:each="request : ${requests}">
    <h3 th:text="${request.language}">English</h3>
    <p>
        <span data-i18n="study.goalLabel">Goal:</span>
        <span th:text="${request.goal}"></span>
    </p>
    <p th:text="${request.topic}"></p>
    <p th:text="${request.difficultPart}"></p>
    <small th:text="${request.createdAt}"></small>
    <hr>
</article>
</body>
</html>
