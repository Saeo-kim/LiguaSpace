spring.application.name=lingua-space

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
# Empty default: Windows PowerShell 5.1 deletes a variable set to '', which
# would otherwise send the literal placeholder as the password to local H2.
spring.datasource.password=${DATABASE_PASSWORD:}

# 개발 중 테이블 자동 생성 및 변경 반영
spring.jpa.hibernate.ddl-auto=update
# 쿼리마다 콘솔에 출력하면 느려지므로 끔
spring.jpa.show-sql=false
# 요청 중 DB 세션을 뷰 렌더링까지 붙잡아 두지 않음
spring.jpa.open-in-view=false

# 기록 목록(JSON)을 gzip으로 압축해서 전송량 줄이기
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=application/json,text/html,text/css,application/javascript

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console


server.port=${PORT:8080}
