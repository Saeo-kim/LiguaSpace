spring.application.name=lingua-space

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# 개발 중 테이블 자동 생성 및 변경 반영
spring.jpa.hibernate.ddl-auto=update
# 쿼리마다 콘솔에 출력하면 느려지므로 끔
spring.jpa.show-sql=false
# 요청 중 DB 세션을 뷰 렌더링까지 붙잡아 두지 않음
spring.jpa.open-in-view=false

# 기록 목록(JSON)을 gzip으로 압축해서 전송량 줄이기
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=application/json,text/html,text/css,text/javascript,application/javascript,image/svg+xml

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console


server.port=${PORT:8080}

# 정적 파일(JS, CSS, 이미지): 매번 서버에 변경 여부만 확인(304 응답), 배포 후 바로 최신 파일 사용
spring.web.resources.cache.cachecontrol.no-cache=true
